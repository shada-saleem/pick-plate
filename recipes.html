<style>
* {

body {

}

button {

}

}

.filter-option input {

.filter-actions {

}

.apply-btn {

.recipe-content p {

}

.recipe-meta {
    display: flex;
    justify-content: space-between;
    margin: 18px 0;
    color: #aaa39a;
    font-size: 13px;

.card-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.view-btn {

}

.fav-btn {

}

.fav-btn.active {

}

.no-results {

}

footer {

    color: #777;

}

/* RECIPE POPUP */

.modal {

    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    overflow-y: auto;
    padding: 30px 15px;
}

.modal-content {

    font-size: 28px;

}

    }

    }
}

// THEMEALDB API

const API_URL = "https://www.themealdb.com/api/json/v1/1/";


// GET FRIDGE INGREDIENTS FROM URL

const params = new URLSearchParams(window.location.search);

let fridgeIngredients = [];

if (params.get("ingredients")) {

    fridgeIngredients = params.get("ingredients")
        .split(",")
        .map(item => item.toLowerCase().trim())
        .filter(item => item !== "");

}


// LOAD FAVOURITES

let favourites = JSON.parse(
    localStorage.getItem("pickPlateFavourites") || "[]"
);

let apiFavourites = JSON.parse(
    localStorage.getItem("pickPlateApiFavourites") || "[]"
);

let apiRecipes = [];

let searchNumber = 0;


// CONVERT API RECIPE

function convertApiRecipe(meal) {

    let ingredients = [];

    for (let i = 1; i <= 20; i++) {

        let ingredient = meal["strIngredient" + i];

        if (ingredient && ingredient.trim() !== "") {

            let measure = meal["strMeasure" + i] || "";

            ingredients.push(
                (measure.trim() + " " + ingredient.trim()).trim()
            );

        }

    }

    let instructions = meal.strInstructions
        ? meal.strInstructions
            .split(/\r?\n/)
            .map(step => step.trim())
            .filter(step => step !== "")
        : ["See the original recipe for instructions."];

    let category = "Meal";

    if (meal.strCategory === "Dessert") {
        category = "Dessert";
    }

    if (
        meal.strCategory === "Starter" ||
        meal.strCategory === "Side"
    ) {
        category = "Snack";
    }

    return {

        id: "meal-" + meal.idMeal,
        name: meal.strMeal,
        category: category,
        time: null,
        description: "A delicious recipe from TheMealDB.",
        image: meal.strMealThumb,
        ingredients: ingredients,
        instructions: instructions,
        source: "api"

    };

}


// SEARCH API BY NAME

async function searchApiByName(searchText) {

    try {

        let response = await fetch(
            API_URL + "search.php?s=" +
            encodeURIComponent(searchText)
        );

        let data = await response.json();

        if (data.meals) {

            return data.meals.map(convertApiRecipe);

        }

        return [];

    } catch (error) {

        console.log("API search error:", error);

        return [];

    }

}


// SEARCH API BY INGREDIENT

async function searchApiByIngredient(ingredient) {

    try {

        let response = await fetch(
            API_URL + "filter.php?i=" +
            encodeURIComponent(ingredient)
        );

        let data = await response.json();

        return data.meals || [];

    } catch (error) {

        console.log("Ingredient search error:", error);

        return [];

    }

}


// GET FULL RECIPE DETAILS

async function getApiRecipeDetails(id) {

    try {

        let response = await fetch(
            API_URL + "lookup.php?i=" +
            encodeURIComponent(id)
        );

        let data = await response.json();

        if (data.meals) {

            return convertApiRecipe(data.meals[0]);

        }

        return null;

    } catch (error) {

        console.log("Recipe details error:", error);

        return null;

    }

}


// SEARCH USING FRIDGE INGREDIENTS

async function searchApiByFridge() {

    let matches = {};

    let ingredientsToSearch = fridgeIngredients.slice(0, 4);

    for (let ingredient of ingredientsToSearch) {

        let results = await searchApiByIngredient(ingredient);

        results.forEach(function(recipe) {

            if (!matches[recipe.idMeal]) {

                matches[recipe.idMeal] = {
                    id: recipe.idMeal,
                    score: 0
                };

            }

            matches[recipe.idMeal].score++;

        });

    }

    let sortedMatches = Object.values(matches)
        .sort((a, b) => b.score - a.score)
        .slice(0, 8);

    let fullRecipes = [];

    for (let recipe of sortedMatches) {

        let details = await getApiRecipeDetails(recipe.id);

        if (details) {

            fullRecipes.push(details);

        }

    }

    return fullRecipes;

}


// GET SELECTED CATEGORIES

function getSelectedCategories() {

    let categories = [];

    document.querySelectorAll(
        'input[name="category"]:checked'
    ).forEach(function(box) {

        categories.push(box.value);

    });

    return categories;

}


// CHECK FILTERS


function matchesFilters(recipe) {

    let selectedCategories = getSelectedCategories();

    let searchText = document.getElementById("searchInput")
        .value.toLowerCase().trim();

    let matchesCategory =
        selectedCategories.length === 0 ||
        selectedCategories.includes(recipe.category);

    let matchesSearch =
        searchText === "" ||
        recipe.name.toLowerCase().includes(searchText) ||
        recipe.ingredients.some(function(ingredient) {
            return ingredient.toLowerCase().includes(searchText);
        });

    // API recipes: only apply search and category filters
    if (recipe.source === "api") {
        return matchesSearch && matchesCategory;
    }

    let matchesVegetarian =
        !document.getElementById("vegetarian").checked ||
        recipe.tags.includes("vegetarian");

    let matchesProtein =
        !document.getElementById("highProtein").checked ||
        recipe.tags.includes("highProtein");

    let matchesLighter =
        !document.getElementById("lighter").checked ||
        recipe.tags.includes("lighter");

    let matchesGluten =
        !document.getElementById("glutenFree").checked ||
        recipe.tags.includes("glutenFree");

    let matchesQuick =
        !document.getElementById("quick").checked ||
        recipe.time <= 10;

    let matchesBudget =
        !document.getElementById("budget").checked ||
        recipe.tags.includes("budget");

    return matchesSearch &&
        matchesCategory &&
        matchesVegetarian &&
        matchesProtein &&
        matchesLighter &&
        matchesGluten &&
        matchesQuick &&
        matchesBudget;
}



// DISPLAY RECIPE CARDS

function displayRecipeCards(filteredRecipes) {

    let recipeGrid = document.getElementById("recipeGrid");

    recipeGrid.innerHTML = "";

    document.getElementById("recipeCount").textContent =
        filteredRecipes.length + " recipes found";

    if (filteredRecipes.length === 0) {

        recipeGrid.innerHTML =
            '<div class="no-results">No recipes found. Try changing your search or filters!</div>';

        return;

    }

    filteredRecipes.forEach(function(recipe) {

        let card = document.createElement("div");

        card.className = "recipe-card";

        let isApiRecipe = recipe.source === "api";

        let isFavourite = isApiRecipe
            ? apiFavourites.some(item => item.id === recipe.id)
            : favourites.includes(recipe.id);

        let cookingTime = recipe.time
            ? "⏱ " + recipe.time + " mins"
            : "Cooking time varies";

        card.innerHTML = `

            <img src="${recipe.image}" alt="${recipe.name}">

            <div class="recipe-content">

                <span class="recipe-category">
                    ${recipe.category}
                </span>

                <h3>${recipe.name}</h3>

                <p>${recipe.description}</p>

                <div class="recipe-meta">

                    <span>${cookingTime}</span>

                    <span>${recipe.ingredients.length} ingredients</span>

                </div>

                <div class="card-buttons">

                    <button class="view-btn">
                        View Recipe
                    </button>

                    <button class="fav-btn ${isFavourite ? "active" : ""}">
                        ${isFavourite ? "♥" : "♡"}
                    </button>

                </div>

            </div>

        `;

        card.querySelector(".view-btn").addEventListener(
            "click",
            function() {
                showRecipe(recipe.id);
            }
        );

        card.querySelector(".fav-btn").addEventListener(
            "click",
            function() {
                toggleFavourite(recipe.id);
            }
        );

        recipeGrid.appendChild(card);

    });

}


// DISPLAY RECIPES

async function displayRecipes() {

    let currentSearch = ++searchNumber;

    let searchText = document.getElementById("searchInput")
        .value.toLowerCase().trim();

    let allRecipes = [...recipes];

    // SEARCH API WHEN USER TYPES SOMETHING

    if (searchText !== "") {

        document.getElementById("recipeGrid").innerHTML =
            '<div class="no-results">Finding delicious recipes...</div>';

        let apiResults = await searchApiByName(searchText);

        if (currentSearch !== searchNumber) {
            return;
        }

        // IF NAME SEARCH DOES NOT FIND ANYTHING,
        // TRY SEARCHING BY INGREDIENT

        if (apiResults.length === 0) {

            let ingredientResults =
                await searchApiByIngredient(searchText);

            let fullResults = [];

            for (let item of ingredientResults.slice(0, 8)) {

                let details = await getApiRecipeDetails(item.idMeal);

                if (details) {
                    fullResults.push(details);
                }

            }

            apiResults = fullResults;

        }

        if (currentSearch !== searchNumber) {
            return;
        }

        apiRecipes = apiResults;

        allRecipes = [...recipes, ...apiRecipes];

    }

    // SEARCH API USING FRIDGE INGREDIENTS

    else if (fridgeIngredients.length > 0) {

        document.getElementById("recipeGrid").innerHTML =
            '<div class="no-results">Checking what you can cook...</div>';

        let fridgeResults = await searchApiByFridge();

        if (currentSearch !== searchNumber) {
            return;
        }

        apiRecipes = fridgeResults;

        allRecipes = [...recipes, ...apiRecipes];

    }

    else {

        apiRecipes = [];

    }

    // REMOVE DUPLICATE RECIPES

    let uniqueRecipes = [];

    let seenIds = new Set();

    allRecipes.forEach(function(recipe) {

        if (!seenIds.has(recipe.id)) {

            seenIds.add(recipe.id);

            uniqueRecipes.push(recipe);

        }

    });

    // APPLY FILTERS

    let filteredRecipes = uniqueRecipes.filter(matchesFilters);

    // SORT BY FRIDGE INGREDIENT MATCHES

    if (fridgeIngredients.length > 0) {

        filteredRecipes.sort(function(a, b) {

            function getMatches(recipe) {

                return recipe.ingredients.filter(function(ingredient) {

                    return fridgeIngredients.some(function(item) {

                        return ingredient.toLowerCase().includes(item) ||
                            item.includes(ingredient.toLowerCase());

                    });

                }).length;

            }

            return getMatches(b) - getMatches(a);

        });

    }

    displayRecipeCards(filteredRecipes);

}


// SHOW RECIPE DETAILS

function showRecipe(id) {

    let recipe = recipes.find(function(item) {
        return item.id === id;
    });

    if (!recipe) {

        recipe = apiRecipes.find(function(item) {
            return item.id === id;
        });

    }

    if (!recipe) {

        recipe = apiFavourites.find(function(item) {
            return item.id === id;
        });

    }

    if (!recipe) {
        return;
    }

    let isApiRecipe = recipe.source === "api";

    let isFavourite = isApiRecipe
        ? apiFavourites.some(item => item.id === recipe.id)
        : favourites.includes(recipe.id);

    let modalBody = document.getElementById("modalBody");

    modalBody.innerHTML = `

        <span class="recipe-category">
            ${recipe.category}
        </span>

        <h2>${recipe.name}</h2>

        <p>
            ${recipe.time
                ? "⏱ " + recipe.time + " minutes"
                : "Cooking time not provided"}
        </p>

        <img src="${recipe.image}" alt="${recipe.name}">

        <p>${recipe.description}</p>

        <h3>Ingredients</h3>

        <ul>
            ${recipe.ingredients.map(function(item) {
                return "<li>" + item + "</li>";
            }).join("")}
        </ul>

        <h3>Instructions</h3>

        <ol>
            ${recipe.instructions.map(function(step) {
                return "<li>" + step + "</li>";
            }).join("")}
        </ol>

        <button class="modal-fav" id="modalFavouriteButton">
            ${isFavourite
                ? "♥ Remove from Favourites"
                : "♡ Add to Favourites"}
        </button>

        ${isApiRecipe
            ? '<p style="margin-top:15px;font-size:12px;">Recipe information provided by TheMealDB.</p>'
            : ""}

    `;

    document.getElementById("modalFavouriteButton")
        .addEventListener("click", function() {

            toggleFavourite(id);

        });

    document.getElementById("recipeModal").style.display = "block";

}


// CLOSE POPUP

function closeModal() {

    document.getElementById("recipeModal").style.display = "none";

}


// ADD OR REMOVE FAVOURITES

function toggleFavourite(id) {

    let isApiRecipe = String(id).startsWith("meal-");

    if (isApiRecipe) {

        let existing = apiFavourites.some(function(item) {
            return item.id === id;
        });

        if (existing) {

            apiFavourites = apiFavourites.filter(function(item) {
                return item.id !== id;
            });

        } else {

            let recipe = apiRecipes.find(function(item) {
                return item.id === id;
            });

            if (!recipe) {

                recipe = apiFavourites.find(function(item) {
                    return item.id === id;
                });

            }

            if (recipe) {

                apiFavourites.push(recipe);

            }

        }

        localStorage.setItem(
            "pickPlateApiFavourites",
            JSON.stringify(apiFavourites)
        );

    } else {

        if (favourites.includes(id)) {

            favourites = favourites.filter(function(item) {
                return item !== id;
            });

        } else {

            favourites.push(id);

        }

        localStorage.setItem(
            "pickPlateFavourites",
            JSON.stringify(favourites)
        );

    }

    displayRecipes();

    if (document.getElementById("recipeModal").style.display === "block") {

        showRecipe(id);

    }

}


// CLEAR FILTERS

function clearFilters() {

    document.getElementById("searchInput").value = "";

    document.querySelectorAll('input[name="category"]')
        .forEach(function(box) {
            box.checked = false;
        });

    document.getElementById("vegetarian").checked = false;
    document.getElementById("highProtein").checked = false;
    document.getElementById("lighter").checked = false;
    document.getElementById("glutenFree").checked = false;
    document.getElementById("quick").checked = false;
    document.getElementById("budget").checked = false;

    fridgeIngredients = [];

    displayRecipes();

}


// SEARCH WHEN ENTER IS PRESSED

document.getElementById("searchInput")
    .addEventListener("keyup", function(event) {

        if (event.key === "Enter") {
            displayRecipes();
        }

    });


// CLOSE POPUP WHEN CLICKING OUTSIDE

window.onclick = function(event) {

    let modal = document.getElementById("recipeModal");

    if (event.target === modal) {
        closeModal();
    }

};

document.getElementById("searchButton").addEventListener("click", function() {
    displayRecipes();
});
// INITIAL DISPLAY

displayRecipes();

</script>
